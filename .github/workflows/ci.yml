name: CI

# Node workspaces: the frontend (lint, typecheck, build) and, until SHAA-9
# removes it, the Node API. The Rust checks are in rust.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck
      - run: npm run build --workspaces --if-present
