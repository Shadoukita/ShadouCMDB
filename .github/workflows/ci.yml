name: CI

# Node workspaces: the frontend (lint, typecheck, API types, build), and the
# Playwright walk of the UI served by the release binary against PostgreSQL.
# The Rust checks are in rust.yml, the release dry run in release.yml.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck
      - name: frontend API types match backend/openapi.json
        run: npm run api:check -w frontend
      - run: npm run build --workspaces --if-present

  e2e:
    name: Playwright e2e (UI embedded in the release binary)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shadoucmdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      # sqlx checks its compile-time queries against backend/.sqlx, not a live database.
      SQLX_OFFLINE: "true"
      # Throwaway credentials for the CI-only PostgreSQL service container.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: shadoucmdb
      PGUSER: ci
      PGPASSWORD: ci-only-password
      DATABASE_SSL: disable
      API_HOST: 127.0.0.1
      API_PORT: "3000"
      # Throwaway administrator for the CI-only database; the e2e suite signs in as it.
      E2E_USERNAME: e2e-admin
      E2E_PASSWORD: e2e-ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace frontend --include-workspace-root --no-audit --no-fund
      # Built before cargo: rust-embed puts frontend/dist into the binary.
      - run: npm run build --workspace frontend

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - run: cargo build --release --locked
        working-directory: backend

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: migrate, seed --demo, create-admin, serve
        run: |
          B=backend/target/release/shadoucmdb
          $B migrate
          $B seed --demo
          printf '%s\n' "$E2E_PASSWORD" | $B create-admin --username "$E2E_USERNAME" --display-name "E2E admin" --password-stdin
          $B serve > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/readyz | grep -q '"upToDate":true'

      # A second instance on an empty, migrated database with no user: e2e/first-run.spec.ts walks the
      # real first-run setup there (the instance above already has an administrator).
      - name: migrate and serve an empty instance for first-run setup
        env:
          PGDATABASE: shadoucmdb_fresh
          API_PORT: "3001"
        run: |
          B=backend/target/release/shadoucmdb
          psql -d postgres -c 'CREATE DATABASE shadoucmdb_fresh'
          $B migrate
          $B serve > serve-fresh.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3001/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:3001/api/v1/setup | grep -q '"setupRequired":true'

      # Two bare installs (system rows only, no user) for e2e/fresh-install.spec.ts: the starter template and an
      # own class are built on the first, and its configuration export is imported into the second.
      - name: migrate, seed and serve two bare instances for the export/import round trip
        run: |
          B=backend/target/release/shadoucmdb
          for i in 2 3; do
            db=shadoucmdb_bare$i
            psql -d postgres -c "CREATE DATABASE $db"
            PGDATABASE=$db $B migrate
            PGDATABASE=$db $B seed
            PGDATABASE=$db API_PORT=300$i $B serve > serve-bare$i.log 2>&1 &
          done
          for i in 2 3; do
            for n in $(seq 1 30); do curl -sf http://127.0.0.1:300$i/readyz && break; sleep 1; done
            curl -sf http://127.0.0.1:300$i/api/v1/setup | grep -q '"setupRequired":true'
          done

      - name: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_FRESH_BASE_URL: http://127.0.0.1:3001
          E2E_BARE_BASE_URL: http://127.0.0.1:3002
          E2E_IMPORT_BASE_URL: http://127.0.0.1:3003
        run: npx playwright test

      - name: No error-level server log lines
        run: |
          errors=$(cat serve.log serve-fresh.log serve-bare2.log serve-bare3.log | grep -c '"level":"ERROR"' || true)
          echo "error-level log lines: $errors"
          if [ "$errors" != "0" ]; then grep '"level":"ERROR"' serve.log serve-fresh.log serve-bare2.log serve-bare3.log; exit 1; fi

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            serve.log
            serve-fresh.log
            serve-bare2.log
            serve-bare3.log
          if-no-files-found: ignore
          retention-days: 14
