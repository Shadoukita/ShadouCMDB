name: CI

# Node workspaces: the frontend (lint, typecheck, API types, build). The Rust
# checks are in rust.yml, the release dry run in release.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck
      - name: frontend API types match backend/openapi.json
        run: npm run api:check -w frontend
      - run: npm run build --workspaces --if-present
