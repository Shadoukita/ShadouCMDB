name: Release

# A tag `v<version>` (matching backend/Cargo.toml) builds the web UI once, embeds
# it in the Linux x64/ARM64 (static musl) and Windows x64 binaries, tests each
# binary against PostgreSQL, pushes the multi-arch image to GHCR and publishes a
# GitHub Release with the archives and SHA256SUMS. See CONTRIBUTING.md.
#
# Supply chain (docs/supply-chain.md): a CycloneDX SBOM of the release, cosign
# keyless signatures (Sigstore bundles) for every file and for the image, and
# SLSA build provenance as GitHub artifact attestations. The image also carries
# BuildKit provenance and the SBOM as a signed cosign attestation.
#
# Pull requests that touch the pipeline run everything except the two publish
# steps (image push and GitHub Release), so a broken pipeline is caught before
# a tag is cut. Same-repository pull requests also sign and attest the dev
# archives, so signing is tested too; those signatures name the PR ref, never
# a v* tag, so they cannot pass for a release (docs/supply-chain.md).
#
# No build caches (rust-cache, npm, zig) anywhere in this workflow: the release
# binaries are signed, so they are built from a clean slate and not from a
# cache that another workflow run could have written.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - deploy/**
      - backend/Cargo.toml
      - backend/Cargo.lock
      - backend/.cargo/**
      - backend/build.rs
      - tools/sbom/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # sqlx checks its compile-time queries against backend/.sqlx, not a live database.
  SQLX_OFFLINE: "true"
  IMAGE: ghcr.io/shadoukita/shadoucmdb
  ZIG_VERSION: 0.14.1
  # Throwaway credentials for the CI-only PostgreSQL service containers.
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGDATABASE: shadoucmdb
  PGUSER: ci
  PGPASSWORD: ci-only-password
  DATABASE_SSL: disable

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sign: ${{ steps.v.outputs.sign }}
      latest: ${{ steps.v.outputs.latest }}
      latest_major: ${{ steps.v.outputs.latest_major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to tell whether this release is the newest one (see below).
          fetch-depth: 0
      - id: v
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$crate" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match backend/Cargo.toml version $crate. Bump the version in a PR first (CONTRIBUTING.md)."
              exit 1
            fi
            publish=true
          else
            version="$crate-dev.${GITHUB_SHA::7}"
            publish=false
          fi
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          # Patch releases also come from maintenance branches (release/X.Y.x,
          # CONTRIBUTING.md). Only the highest stable version overall moves
          # `latest`, and only the highest within its major moves the bare
          # major image tag, so a 0.1.5 fix after 0.2.0 never takes them over.
          latest=false; latest_major=false
          if [ "$publish" = true ] && [ "$prerelease" = false ]; then
            stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
            [ "$(tail -1 <<<"$stable")" = "$GITHUB_REF_NAME" ] && latest=true
            [ "$(grep -F "v${version%%.*}." <<<"$stable" | tail -1)" = "$GITHUB_REF_NAME" ] && latest_major=true
          fi
          # Keyless signing needs an OIDC token, which fork pull requests do not get.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then sign=true; else sign=false; fi
          echo "version=$version publish=$publish prerelease=$prerelease sign=$sign latest=$latest latest_major=$latest_major" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "version=$version"; echo "publish=$publish"; echo "prerelease=$prerelease"; echo "sign=$sign"; echo "latest=$latest"; echo "latest_major=$latest_major"; } >> "$GITHUB_OUTPUT"

  ui:
    name: Web UI (built once)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --workspace frontend --include-workspace-root --no-audit --no-fund
      - run: npm run build --workspace frontend
      - run: test -f frontend/dist/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ui
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM (CycloneDX)
    needs: [meta]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SBOM: shadoucmdb-${{ needs.meta.outputs.version }}.cdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --workspace frontend --include-workspace-root --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/sbom --ignore-scripts --omit=optional --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-cyclonedx,cyclonedx
      - run: .github/scripts/sbom.sh "$VERSION" "dist/$SBOM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: dist/${{ env.SBOM }}
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux ${{ matrix.arch }} (static musl)
    needs: [meta, ui]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            docker_arch: amd64
            target: x86_64-unknown-linux-musl
            run: ""
          - arch: arm64
            docker_arch: arm64
            target: aarch64-unknown-linux-musl
            run: qemu-aarch64-static
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shadoucmdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PKG: shadoucmdb-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ui
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-zigbuild

      # zig is the C compiler and linker for ring and mimalloc, and brings the
      # musl libc for both architectures, so neither target needs a sysroot.
      - name: cargo zigbuild --release --target ${{ matrix.target }}
        working-directory: backend
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Inspect the binary
        run: |
          B=backend/target/${{ matrix.target }}/release/shadoucmdb
          file "$B"
          file "$B" | grep -q 'statically linked'
          ls -l "$B"

      - if: matrix.run != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: migrate, serve, /healthz, /readyz, UI (${{ matrix.run == '' && 'native' || 'under QEMU' }})
        run: |
          B="${{ matrix.run }} backend/target/${{ matrix.target }}/release/shadoucmdb"
          $B --version
          $B migrate
          $B seed --demo
          API_HOST=127.0.0.1 API_PORT=3000 .github/scripts/smoke.sh 3000 $B serve

      - name: Package
        run: |
          mkdir -p "dist/$PKG" dist/docker/linux-${{ matrix.docker_arch }}
          install -m 0755 backend/target/${{ matrix.target }}/release/shadoucmdb "dist/$PKG/shadoucmdb"
          cp deploy/linux/README.txt "dist/$PKG/"
          cp deploy/systemd/shadoucmdb.service "dist/$PKG/"
          cp .env.example "dist/$PKG/shadoucmdb.env.example"
          install -d "dist/$PKG/sql/bootstrap"
          install -m 0644 sql/bootstrap/*.sql "dist/$PKG/sql/bootstrap/"
          tar -C dist -czf "dist/$PKG.tar.gz" --owner=0 --group=0 "$PKG"
          tar -tvzf "dist/$PKG.tar.gz"
          cp "dist/$PKG/shadoucmdb" dist/docker/linux-${{ matrix.docker_arch }}/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/${{ env.PKG }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-linux-${{ matrix.docker_arch }}
          path: dist/docker
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: [meta, ui]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PKG: shadoucmdb-${{ needs.meta.outputs.version }}-windows-x64
      # The preinstalled PostgreSQL on the Windows runner.
      PGUSER: postgres
      PGPASSWORD: root
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ui
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # backend/.cargo/config.toml links the C runtime statically (+crt-static).
      - run: cargo build --release --locked
        working-directory: backend

      - name: No DLLs beyond the Windows system set
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents backend\target\release\shadoucmdb.exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          $deps
          $bad = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase)' }
          if ($bad) { throw "links the dynamic C runtime: $bad" }

      - name: Start the preinstalled PostgreSQL
        run: |
          $pg = Get-Service -Name postgresql*
          Set-Service -InputObject $pg -StartupType Manual
          Start-Service -InputObject $pg

      - name: migrate, serve, /healthz, /readyz, UI (native)
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path backend\target\release\shadoucmdb.exe).Path
          & $exe --version
          & $exe migrate; if ($LASTEXITCODE) { throw 'migrate failed' }
          & $exe seed --demo; if ($LASTEXITCODE) { throw 'seed failed' }
          $env:API_HOST = '127.0.0.1'; $env:API_PORT = '3000'
          $p = Start-Process -FilePath $exe -ArgumentList serve -PassThru -NoNewWindow -RedirectStandardOutput serve.log
          try {
            $live = $null
            for ($i = 0; $i -lt 60 -and -not $live; $i++) {
              try { $live = Invoke-RestMethod http://127.0.0.1:3000/healthz } catch { Start-Sleep 1 }
            }
            "GET /healthz -> $($live | ConvertTo-Json -Compress)"
            if ($live.status -ne 'ok') { throw '/healthz did not answer' }
            $ready = Invoke-RestMethod http://127.0.0.1:3000/readyz
            "GET /readyz  -> $($ready | ConvertTo-Json -Compress)"
            if (-not $ready.migrations.upToDate) { throw 'not ready' }
            $ui = Invoke-WebRequest http://127.0.0.1:3000/
            if ($ui.Content -notmatch '(?i)<!doctype html>') { throw 'no embedded UI' }
            "GET /        -> embedded web UI (index.html)"
            "Working set: $([math]::Round((Get-Process -Id $p.Id).WorkingSet64 / 1MB, 1)) MiB"
          } finally {
            Stop-Process -Id $p.Id -Force
            Get-Content serve.log -Tail 5
          }

      - name: Package
        run: |
          New-Item -ItemType Directory -Force "dist\$env:PKG" | Out-Null
          Copy-Item backend\target\release\shadoucmdb.exe "dist\$env:PKG\"
          Copy-Item deploy\windows\README.txt "dist\$env:PKG\"
          Copy-Item .env.example "dist\$env:PKG\shadoucmdb.env.example"
          New-Item -ItemType Directory -Force "dist\$env:PKG\sql\bootstrap" | Out-Null
          Copy-Item sql\bootstrap\*.sql "dist\$env:PKG\sql\bootstrap\"
          Compress-Archive -Path "dist\$env:PKG" -DestinationPath "dist\$env:PKG.zip"
          Get-ChildItem -Recurse "dist\$env:PKG" | Format-Table FullName, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: dist/${{ env.PKG }}.zip
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    # Waits for windows too: this job pushes to GHCR (incl. latest), so it must
    # not run unless every binary passed, just like the GitHub Release.
    needs: [meta, sbom, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signatures and the provenance attestation (published images only).
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shadoucmdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-linux-*
          path: dist/docker
          merge-multiple: true
      - run: find dist/docker -type f -exec ls -l {} +
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test each platform's image against PostgreSQL
        run: |
          E="-e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e DATABASE_SSL"
          for arch in amd64 arm64; do
            docker buildx build --load --platform linux/$arch -f deploy/docker/Dockerfile.release -t shadoucmdb:$arch dist/docker
            docker image inspect shadoucmdb:$arch --format "$arch: os/arch={{.Os}}/{{.Architecture}} user={{.Config.User}} size={{.Size}}"
            docker run --rm --network host $E shadoucmdb:$arch migrate
            .github/scripts/smoke.sh 3000 docker run --rm --init --network host $E shadoucmdb:$arch
          done

      - if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.2.3 -> 1.2.3, 1.2, 1 (not for 0.x, and only if it is the newest 1.x)
      # and latest (only if it is the newest release overall). A pre-release
      # such as 1.2.3-rc.1 gets only its own tag, never latest.
      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ needs.meta.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') && needs.meta.outputs.latest_major == 'true' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=ShadouCMDB
            org.opencontainers.image.description=Self-hosted CMDB: REST API and web UI in one binary. PostgreSQL is external.
      # BuildKit adds SLSA provenance (mode=max) and an SPDX SBOM to the image index.
      - name: Build both platforms${{ needs.meta.outputs.publish == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/docker
          file: deploy/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Everything below signs by digest, never by tag, so a tag moved in the
      # meantime cannot get a signature.
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: sbom
      - if: needs.meta.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign the image, attest the CycloneDX SBOM
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "sbom/shadoucmdb-$VERSION.cdx.json" "$IMAGE@$DIGEST"
      - name: SLSA build provenance for the image
        if: needs.meta.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the signatures, pull and run the pushed image on both platforms
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ref="$IMAGE:$VERSION"
          docker buildx imagetools inspect "$ref"
          id=(--certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          cosign verify "${id[@]}" "$ref" > /dev/null
          cosign verify-attestation --type cyclonedx "${id[@]}" "$ref" > /dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF"
          for arch in amd64 arm64; do
            docker rmi -f "$ref" >/dev/null 2>&1 || true
            docker pull --platform linux/$arch "$ref"
            docker run --rm --platform linux/$arch "$ref" --version
          done

  sign:
    name: Sign, checksums and provenance
    needs: [meta, sbom, linux, windows]
    if: needs.meta.outputs.sign == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum shadoucmdb-* > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # One Sigstore bundle (signature + Fulcio certificate + Rekor entry) per file.
      - name: cosign sign-blob (keyless)
        working-directory: dist
        run: |
          for f in shadoucmdb-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
      - name: SLSA build provenance for the archives and the SBOM
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/shadoucmdb-*.tar.gz
            dist/shadoucmdb-*.zip
            dist/shadoucmdb-*.cdx.json
      - name: Attach the provenance bundle (offline verification)
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/shadoucmdb-$VERSION.provenance.jsonl"

      # The same checks docs/supply-chain.md gives users, run before anything is published.
      - name: Verify every signature and the provenance
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          for f in shadoucmdb-*.tar.gz shadoucmdb-*.zip shadoucmdb-*.cdx.json SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          for f in shadoucmdb-*.tar.gz shadoucmdb-*.zip shadoucmdb-*.cdx.json; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --bundle "shadoucmdb-$VERSION.provenance.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" > /dev/null
            echo "$f: provenance OK"
          done
          ls -l
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [meta, sign, docker]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          LATEST: ${{ needs.meta.outputs.latest }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          [ "$LATEST" = true ] && flags+=(--latest) || flags+=(--latest=false)
          cat > notes.md <<EOF
          | Platform | Download |
          | --- | --- |
          | Linux x64 (static, any distribution) | \`shadoucmdb-$VERSION-linux-x64.tar.gz\` |
          | Linux ARM64 (static, any distribution) | \`shadoucmdb-$VERSION-linux-arm64.tar.gz\` |
          | Windows Server x64 | \`shadoucmdb-$VERSION-windows-x64.zip\` |
          | Docker (linux/amd64, linux/arm64) | \`docker pull $IMAGE:$VERSION\` |
          | SBOM (CycloneDX JSON) | \`shadoucmdb-$VERSION.cdx.json\` |

          Check downloads with \`sha256sum --ignore-missing -c SHA256SUMS\`. Each archive has a README.txt with install steps; see also [docs/deployment.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/deployment.md).

          Every file has a cosign keyless signature (\`<file>.sigstore.json\`) and SLSA build provenance (\`shadoucmdb-$VERSION.provenance.jsonl\`, also in the repository's attestations); the image is signed and carries provenance and the SBOM. How to verify: [docs/supply-chain.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/supply-chain.md).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ShadouCMDB $VERSION" --notes-file notes.md --generate-notes "${flags[@]}"
