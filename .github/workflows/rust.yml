name: Rust

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sqlx checks its compile-time queries against backend/.sqlx, not a live database.
  SQLX_OFFLINE: "true"
  # Throwaway credentials for the CI-only PostgreSQL service container.
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGDATABASE: shadoucmdb
  PGUSER: ci
  PGPASSWORD: ci-only-password
  DATABASE_SSL: disable

defaults:
  run:
    # An explicit `shell: bash` runs with -o pipefail (the default shell does not),
    # so `cmd | tee file` fails the step when cmd fails (GH#335).
    shell: bash

jobs:
  linux:
    name: Linux x64 + arm64 (PostgreSQL integration, systemd)
    runs-on: ubuntu-latest
    # Green runs take 20-30 min. Without a limit a hung step holds the check
    # open for GitHub's 6 h default (runs 37674294922, 37682966008).
    timeout-minutes: 60
    services:
      postgres:
        # Docker Hub mirror: anonymous docker.io pulls hit its rate limit on shared runners (SHAA-2894).
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shadoucmdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          # The PostgreSQL-backed tests create their own scratch databases here.
          SHADOUCMDB_TEST_DATABASE_URL: postgres://ci:ci-only-password@127.0.0.1:5432/shadoucmdb
      - run: cargo build --release --locked
      - name: backend/openapi.json matches the code
        run: ./target/release/shadoucmdb openapi --check openapi.json

      # GH#189: serve refuses to start without the key that encrypts the TOTP seeds.
      - name: generate-encryption-key; serve refuses to start without ENCRYPTION_KEY_FILE
        run: |
          B=./target/release/shadoucmdb
          K="$RUNNER_TEMP/encryption.key"
          if $B serve > no-key.log 2>&1; then echo "serve started without a key" >&2; exit 1; fi
          grep -q "ENCRYPTION_KEY_FILE is not set" no-key.log
          $B generate-encryption-key --out "$K"
          test "$(stat -c %a "$K")" = 600
          if $B generate-encryption-key --out "$K"; then echo "an existing key file was overwritten" >&2; exit 1; fi
          chmod 644 "$K"
          if ENCRYPTION_KEY_FILE="$K" $B serve > open-key.log 2>&1; then echo "serve accepted a world-readable key" >&2; exit 1; fi
          grep -q "chmod 600" open-key.log
          chmod 600 "$K"
          echo "ENCRYPTION_KEY_FILE=$K" >> "$GITHUB_ENV"

      - name: migrate, migrate (no-op), seed, verify, seed --demo, verify
        run: |
          B=./target/release/shadoucmdb
          $B migrate
          $B migrate | tee second.txt
          grep -q "nothing to do" second.txt
          $B seed
          $B verify
          $B seed --demo
          $B verify

      - name: serve, /healthz, /readyz, smoke suite (every operation), graceful shutdown
        env:
          # Throwaway first-run setup token: the smoke suite completes setup with it.
          SETUP_TOKEN: ci-only-setup-token-not-a-secret-0123456789
        run: |
          API_HOST=127.0.0.1 API_PORT=3000 API_DOCS=public ./target/release/shadoucmdb serve > serve.log &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/readyz | tee readyz.json
          grep -q '"upToDate":true' readyz.json
          echo "idle RSS: $(grep VmRSS /proc/$PID/status)"
          API_URL=http://127.0.0.1:3000 node ../tools/smoke/smoke.ts
          echo "RSS after smoke: $(grep VmRSS /proc/$PID/status)"
          kill -TERM $PID && wait $PID
          grep -q "server stopped" serve.log
          errors=$(grep -c '"level":"ERROR"' serve.log || true)
          echo "error-level log lines: $errors"
          if [ "$errors" != "0" ]; then grep '"level":"ERROR"' serve.log; exit 1; fi

      # Nothing may depend on the default role or database names (GH#42). These need quoting.
      - name: "Three roles with custom names: bootstrap, migrate, seed, verify, prune-audit, smoke suite, backup and restore"
        env:
          ADMIN_URL: postgres://ci:ci-only-password@127.0.0.1:5432/postgres
          U: 127.0.0.1:5432/invqa-cmdb
          SETUP_TOKEN: ci-only-setup-token-not-a-secret-0123456789
        run: |
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -v owner_role=invqa-owner -v app_role=invqa.api -v maintenance_role=Invqa-Maint -v db_name=invqa-cmdb \
            -f ../sql/bootstrap/00_create_role_and_database.sql
          # The documented unattended path (GH#444): no terminal, so \password reads password and confirmation from stdin.
          printf '%s\n' ci-owner ci-owner ci-app ci-app ci-maint ci-maint | psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 \
            -c '\password "invqa-owner"' -c '\password "invqa.api"' -c '\password "Invqa-Maint"'
          test "$(psql "$ADMIN_URL" -XAtc "SELECT count(*) FROM pg_authid WHERE rolname IN ('invqa-owner', 'invqa.api', 'Invqa-Maint')
                                           AND rolpassword LIKE 'SCRAM-SHA-256\$%'")" = 3
          export DATABASE_URL="postgres://invqa.api:ci-app@$U" MAINTENANCE_DATABASE_URL="postgres://Invqa-Maint:ci-maint@$U"
          B=./target/release/shadoucmdb
          MIGRATION_DATABASE_URL="postgres://invqa-owner:ci-owner@$U" $B migrate | tee migrate.txt
          grep -q "API role: invqa.api" migrate.txt
          grep -q "maintenance role: Invqa-Maint" migrate.txt
          MIGRATION_DATABASE_URL="postgres://invqa-owner:ci-owner@$U" $B migrate | grep -q "nothing to do"
          $B seed --demo
          $B verify
          $B audit-verify
          # Only the audit_log trigger may move the hash-chain head (migration 0018), whatever the API role is called;
          # the API role reads it for `backup` (migration 0038).
          test "$(psql "postgres://invqa-owner:ci-owner@$U" -XAtc \
            "SELECT has_table_privilege('invqa.api', 'cmdb.audit_log_chain_head', 'SELECT')
                    AND NOT has_table_privilege('invqa.api', 'cmdb.audit_log_chain_head', 'INSERT,UPDATE,DELETE,TRUNCATE,TRIGGER')")" = t
          # The API reads and adds server keys but never changes or deletes them (migration 0021).
          test "$(psql "postgres://invqa-owner:ci-owner@$U" -XAtc \
            "SELECT has_table_privilege('invqa.api', 'cmdb.server_keys', 'SELECT') AND has_table_privilege('invqa.api', 'cmdb.server_keys', 'INSERT')
                    AND NOT has_table_privilege('invqa.api', 'cmdb.server_keys', 'UPDATE,DELETE,TRUNCATE')")" = t
          $B prune-audit --older-than 180d
          API_HOST=127.0.0.1 API_PORT=3002 API_DOCS=public $B serve > serve-custom.log &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3002/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:3002/readyz | grep -q '"upToDate":true'
          API_URL=http://127.0.0.1:3002 node ../tools/smoke/smoke.ts
          kill -TERM $PID && wait $PID
          errors=$(grep -c '"level":"ERROR"' serve-custom.log || true)
          if [ "$errors" != "0" ]; then grep '"level":"ERROR"' serve-custom.log; exit 1; fi
          # GH#396: backup runs as the API role (DATABASE_URL), restore as the schema owner; the audit
          # chain verifies afterwards. GH#513: the restored chain continues from the backed-up head with
          # exactly one backup.restore entry.
          HEAD="SELECT (last_seq + 1) || ':' || encode(last_hash, 'hex') FROM cmdb.audit_log_chain_head"
          before=$(psql "postgres://invqa-owner:ci-owner@$U" -XAtc "$HEAD")
          $B backup --out "$RUNNER_TEMP/three-role.jsonl.gz"
          MIGRATION_DATABASE_URL="postgres://invqa-owner:ci-owner@$U" $B restore --replace --yes "$RUNNER_TEMP/three-role.jsonl.gz"
          $B audit-verify
          test "$(psql "postgres://invqa-owner:ci-owner@$U" -XAtc \
            "SELECT h.last_seq || ':' || encode(l.prev_hash, 'hex') || ':' || l.action::text
               FROM cmdb.audit_log_chain_head h JOIN cmdb.audit_log l ON l.chain_seq = h.last_seq")" = "$before:backup.restore"
          $B verify

      # The unattended \password step of deploy/linux/README.txt (GH#450): empty input exits 0 and clears the password,
      # so the documented guard and check must catch it. Same commands as the README, with the role renamed.
      - name: "Unattended \\password: an empty password variable is refused, a set one passes the check"
        env:
          ADMIN_URL: postgres://ci:ci-only-password@127.0.0.1:5432/postgres
        run: |
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -v owner_role=gh450_owner -v app_role=gh450_app \
            -v maintenance_role=gh450_maint -v db_name=gh450 -f ../sql/bootstrap/00_create_role_and_database.sql
          documented() {
            : "${OWNER_PW:?OWNER_PW is unset or empty}"
            printf '%s\n%s\n' "$OWNER_PW" "$OWNER_PW" | setsid -w psql "$ADMIN_URL" -X \
                 -v ON_ERROR_STOP=1 -c '\password gh450_owner'
            test "$(psql "$ADMIN_URL" -XAtc "SELECT rolpassword LIKE 'SCRAM-SHA-256\$%' \
                 FROM pg_authid WHERE rolname = 'gh450_owner'")" = t
          }
          # Empty and unset variables: the sequence must fail, and the role must still have no password.
          if (OWNER_PW= documented); then echo "empty OWNER_PW was accepted"; exit 1; fi
          if (unset OWNER_PW; documented); then echo "unset OWNER_PW was accepted"; exit 1; fi
          # Why the guard exists: without it psql exits 0 on empty input; only the check catches it.
          setsid -w psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -c '\password gh450_owner' </dev/null
          if test "$(psql "$ADMIN_URL" -XAtc "SELECT rolpassword IS NULL FROM pg_authid WHERE rolname = 'gh450_owner'")" != t; then
            echo "expected the role to have no password"; exit 1
          fi
          # A set variable passes, and the role logs in with it (the non-superuser check).
          (OWNER_PW=ci-owner-450 documented)
          PGPASSWORD=ci-owner-450 psql "postgres://gh450_owner@127.0.0.1:5432/gh450" -X -c 'SELECT 1'

      # LDAP/AD sign-in against a real directory (tools/ldap-it/README.md): OpenLDAP, LDAPS only,
      # with a CA made in this step. Started here rather than as a service container, which would
      # start before the certificates exist; the test also stops and starts it.
      - name: "LDAPS directory: sign-in, group mapping, TLS trust, encrypted bind password, requireMfa re-auth, renamed entry"
        env:
          PGDATABASE: shadoucmdb_ldap
          LDAP_IT_SERVE_LOG: serve-ldap.log
          # Pull the pinned OpenLDAP image through the Docker Hub mirror (SHAA-2894).
          LDAP_IT_REGISTRY: mirror.gcr.io
          # Throwaway first-run setup token: the test completes setup with it. ENCRYPTION_KEY_FILE
          # comes from the key step above, so the bind password is stored encrypted.
          SETUP_TOKEN: ci-only-setup-token-not-a-secret-0123456789
        run: |
          trap 'if [ $? != 0 ]; then
            echo "::group::server log"; tail -100 serve-ldap.log || true; echo "::endgroup::"
            echo "::group::directory log"; ../tools/ldap-it/ldap.sh logs || true; echo "::endgroup::"
          fi' EXIT
          psql -d postgres -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE shadoucmdb_ldap'
          B=./target/release/shadoucmdb
          $B migrate
          ../tools/ldap-it/ldap.sh start
          ../tools/ldap-it/ldap.sh seed > /dev/null
          API_HOST=127.0.0.1 API_PORT=3003 $B serve > serve-ldap.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3003/readyz && break; sleep 1; done
          API_URL=http://127.0.0.1:3003 node ../tools/ldap-it/ldap-it.ts
          kill -TERM $PID && wait $PID
          ../tools/ldap-it/ldap.sh remove

      - name: systemd unit (deploy/systemd/shadoucmdb.service)
        run: |
          sudo install -m 0755 target/release/shadoucmdb /usr/local/bin/shadoucmdb
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin shadoucmdb
          sudo install -d -m 0750 -o root -g shadoucmdb /etc/shadoucmdb
          # The key the database's secrets are already encrypted with, readable by the service's group only.
          sudo install -m 0640 -o root -g shadoucmdb "$ENCRYPTION_KEY_FILE" /etc/shadoucmdb/encryption.key
          printf 'PGHOST=%s\nPGPORT=%s\nPGDATABASE=%s\nPGUSER=%s\nPGPASSWORD=%s\nDATABASE_SSL=disable\nAPI_HOST=127.0.0.1\nAPI_PORT=3001\nENCRYPTION_KEY_FILE=/etc/shadoucmdb/encryption.key\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$PGPASSWORD" | sudo install -m 0640 -o root -g shadoucmdb /dev/stdin /etc/shadoucmdb/shadoucmdb.env
          sudo cp ../deploy/systemd/shadoucmdb.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl start shadoucmdb
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3001/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:3001/readyz | grep -q '"upToDate":true'
          sudo systemctl stop shadoucmdb
          sudo journalctl -u shadoucmdb --no-pager | tail -20
          # Not grep -q: it stops reading at the first match, and under pipefail the writer's SIGPIPE fails the step.
          sudo journalctl -u shadoucmdb --no-pager | grep "server stopped" > /dev/null

      # apt-get on its own step: both hung runs above stalled in this step, and
      # a separate limit names the stalled part when it happens again.
      - name: Install the aarch64 cross toolchain and QEMU
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - name: aarch64-unknown-linux-gnu (cross-build, run verify under QEMU)
        timeout-minutes: 25
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          file target/aarch64-unknown-linux-gnu/release/shadoucmdb
          qemu-aarch64 -L /usr/aarch64-linux-gnu target/aarch64-unknown-linux-gnu/release/shadoucmdb verify

  windows:
    name: Windows x64 (MSVC, Windows Service)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - run: cargo test --locked
        working-directory: backend
        env:
          # PostgreSQL is not running yet here; the Linux job runs those tests.
          SHADOUCMDB_SKIP_DB_TESTS: "1"
      - run: cargo build --release --locked
        working-directory: backend

      - name: Start the preinstalled PostgreSQL
        run: |
          $pg = Get-Service -Name postgresql*
          Set-Service -InputObject $pg -StartupType Manual
          Start-Service -InputObject $pg
          "PostgreSQL service: $($pg.Name)"

      - name: Install, run and remove the Windows Service
        env:
          PGUSER: postgres
          PGPASSWORD: root
          PGDATABASE: postgres
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'C:\Program Files\ShadouCMDB'
          $data = 'C:\ProgramData\ShadouCMDB'
          New-Item -ItemType Directory -Force $bin, $data | Out-Null
          Copy-Item backend\target\release\shadoucmdb.exe $bin
          $exe = Join-Path $bin 'shadoucmdb.exe'
          & $exe --version
          & $exe migrate; if ($LASTEXITCODE) { throw 'migrate failed' }
          & $exe seed --demo; if ($LASTEXITCODE) { throw 'seed failed' }
          & $exe verify; if ($LASTEXITCODE) { throw 'verify failed' }

          function Wait-Ready {
            $ready = $null
            for ($i = 0; $i -lt 30 -and -not $ready; $i++) {
              try { $ready = Invoke-RestMethod http://127.0.0.1:3000/readyz } catch { Start-Sleep 1 }
            }
            $ready | ConvertTo-Json -Compress
            if (-not $ready.migrations.upToDate) { throw 'service is not ready' }
          }

          # 1. An install as set up before SHAA-1216: the service runs as LocalService with Modify on the
          #    whole data folder. LocalService owns what it created there, such as an old setup-token.
          @(
            "PGHOST=$env:PGHOST", "PGPORT=$env:PGPORT", "PGDATABASE=$env:PGDATABASE",
            "PGUSER=$env:PGUSER", "PGPASSWORD=$env:PGPASSWORD", 'DATABASE_SSL=disable',
            'API_HOST=127.0.0.1', 'API_PORT=3000', "ENCRYPTION_KEY_FILE='$data\encryption.key'"
          ) | Set-Content -Encoding ascii "$data\shadoucmdb.env"
          icacls $data /inheritance:r /grant:r 'Administrators:(OI)(CI)F' 'SYSTEM:(OI)(CI)F' '*S-1-5-19:(OI)(CI)M' | Out-Null
          & $exe generate-encryption-key --out "$data\encryption.key"; if ($LASTEXITCODE) { throw 'generate-encryption-key failed' }
          icacls "$data\encryption.key" /inheritance:r /grant:r 'Administrators:F' 'SYSTEM:F' '*S-1-5-19:R' | Out-Null
          & $exe --env-file "$data\shadoucmdb.env" --log-file "$data\logs\shadoucmdb.log" service install --account 'NT AUTHORITY\LocalService'
          if ($LASTEXITCODE) { throw 'service install (LocalService) failed' }
          Start-Service ShadouCMDB
          Wait-Ready
          Stop-Service ShadouCMDB
          Set-Content "$data\setup-token" 'old'
          icacls "$data\logs" /setowner '*S-1-5-19' /T /C
          icacls "$data\setup-token" /setowner '*S-1-5-19' /C
          foreach ($p in "$data\logs", "$data\setup-token") {
            if ((Get-Acl $p).GetOwner([Security.Principal.SecurityIdentifier]).Value -ne 'S-1-5-19') { throw "could not make LocalService the owner of $p" }
          }

          # 2. The upgrade steps from deploy/windows/README.txt. The link check must refuse a junction.
          Add-Content -Encoding ascii "$data\shadoucmdb.env" "SETUP_TOKEN_FILE='$data\state\setup-token'"
          $svc = 'NT SERVICE\ShadouCMDB'
          & $exe service uninstall; if ($LASTEXITCODE) { throw 'service uninstall failed' }
          & $exe --env-file "$data\shadoucmdb.env" --log-file "$data\logs\shadoucmdb.log" service install
          if ($LASTEXITCODE) { throw 'service install failed' }
          function Find-ReparsePoint($dir) {
            Get-ChildItem -LiteralPath $dir -Force -ErrorAction Stop | ForEach-Object {
              if ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) { $_.FullName }
              elseif ($_.PSIsContainer) { Find-ReparsePoint $_.FullName } }
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\elsewhere" | Out-Null
          New-Item -ItemType Junction -Path "$data\logs\planted" -Target "$env:RUNNER_TEMP\elsewhere" | Out-Null
          if (-not (Find-ReparsePoint $data)) { throw 'the link check missed a junction' }
          Remove-Item "$data\logs\planted" -Force
          # A folder that Administrators may not list must stop the check, not hide a link from it. The
          # guide is run interactively, where errors do not stop a script, so test with that default.
          New-Item -ItemType Directory -Force "$data\logs\hidden" | Out-Null
          New-Item -ItemType Junction -Path "$data\logs\hidden\planted" -Target "$env:RUNNER_TEMP\elsewhere" | Out-Null
          icacls "$data\logs\hidden" /deny '*S-1-5-32-544:(RD)' | Out-Null
          $stopped = $false
          try { & { $ErrorActionPreference = 'Continue'; Find-ReparsePoint $data } | Out-Null } catch { $stopped = $true }
          if (-not $stopped) { throw 'the link check passed over a folder it could not read' }
          icacls "$data\logs\hidden" /remove:d '*S-1-5-32-544' | Out-Null
          Remove-Item "$data\logs\hidden\planted" -Force
          Remove-Item "$data\logs\hidden" -Force
          if ((Get-Item -LiteralPath $data -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw "$data is a link" }
          icacls $data /setowner '*S-1-5-32-544' /C
          icacls $data /reset /C
          icacls $data /inheritance:r /grant:r 'Administrators:(OI)(CI)F' 'SYSTEM:(OI)(CI)F'
          if ($links = Find-ReparsePoint $data) { throw "Remove these links from the data folder first: $links" }
          Remove-Item "$data\setup-token" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$data\logs", "$data\state" | Out-Null
          icacls $data /setowner '*S-1-5-32-544' /T /C
          icacls "$data\*" /reset /T /C
          icacls $data /grant "${svc}:RX"
          icacls "$data\shadoucmdb.env" /grant "${svc}:R"
          icacls "$data\encryption.key" /inheritance:r /grant:r 'Administrators:F' 'SYSTEM:F' "${svc}:R"
          icacls "$data\logs" /grant "${svc}:(OI)(CI)M"
          icacls "$data\state" /grant "${svc}:(OI)(CI)M"
          icacls $data /T /C

          # 3. The result: the service's own account, Administrators own everything, LocalService has
          #    no entry anywhere, and the service can change nothing but logs\ and state\.
          $account = (Get-CimInstance Win32_Service -Filter "Name='ShadouCMDB'").StartName
          "Service account: $account"
          if ($account -ne $svc) { throw "service runs as $account, not its virtual account" }
          $svcSid = ([Security.Principal.NTAccount]$svc).Translate([Security.Principal.SecurityIdentifier]).Value
          $sid = [Security.Principal.SecurityIdentifier]
          foreach ($item in @(Get-Item $data -Force) + @(Get-ChildItem $data -Recurse -Force)) {
            $acl = Get-Acl $item.FullName
            if ($acl.GetOwner($sid).Value -ne 'S-1-5-32-544') { throw "$($item.FullName) is owned by $($acl.Owner)" }
            if ($acl.GetAccessRules($true, $true, $sid) | Where-Object { $_.IdentityReference.Value -eq 'S-1-5-19' }) { throw "LocalService still has access to $($item.FullName)" }
          }
          if (Test-Path "$data\setup-token") { throw 'the old setup-token was not removed' }
          # Write data, append data, write EA, delete child, write attributes, delete, WRITE_DAC,
          # WRITE_OWNER, GENERIC_ALL, GENERIC_WRITE.
          $writeMask = 0x2 -bor 0x4 -bor 0x10 -bor 0x40 -bor 0x100 -bor 0x10000 -bor 0x40000 -bor 0x80000 -bor 0x10000000 -bor 0x40000000
          foreach ($path in $data, "$data\shadoucmdb.env", "$data\encryption.key") {
            $rules = @((Get-Acl $path).GetAccessRules($true, $true, $sid) | Where-Object { $_.IdentityReference.Value -eq $svcSid })
            if (-not $rules) { throw "$svc has no access to $path" }
            foreach ($rule in $rules) {
              if ($rule.AccessControlType -eq 'Allow' -and ([int64]$rule.FileSystemRights -band $writeMask)) { throw "$svc can change ${path}: $($rule.FileSystemRights)" }
            }
          }

          Start-Service ShadouCMDB
          Get-Service ShadouCMDB | Format-List Name, Status, StartType
          Wait-Ready

          Stop-Service ShadouCMDB
          Get-Content "$data\logs\shadoucmdb.log" -Tail 5
          if (-not (Select-String -Quiet -Path "$data\logs\shadoucmdb.log" -Pattern 'stop requested by the Service Control Manager')) { throw 'no graceful stop in log' }
          & $exe service uninstall
          if (Get-Service ShadouCMDB -ErrorAction SilentlyContinue) { throw 'service still registered' }

  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Docker Hub mirror: anonymous docker.io pulls hit its rate limit on shared runners (SHAA-2894).
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shadoucmdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # binfmt and BuildKit images come from Docker Hub; pull them through the mirror (SHAA-2894).
          # Pinned by digest (SHAA-3018): Dependabot does not bump images in workflow files, so
          # refresh by hand with `docker buildx imagetools inspect <image:tag>`; keep the
          # Dockerfile syntax lines and the binfmt/buildkit pins here and in release.yml in step.
          image: mirror.gcr.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          # The Dockerfile's syntax frontend and its node and rust bases come from Docker Hub too.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: shadoucmdb:amd64
          cache-from: type=gha
      - name: Load arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: shadoucmdb:arm64
          cache-from: type=gha
      - name: Run the image against PostgreSQL
        run: |
          docker image ls shadoucmdb
          docker image inspect shadoucmdb:amd64 --format 'user={{.Config.User}} entrypoint={{.Config.Entrypoint}} cmd={{.Config.Cmd}}'
          E="-e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e DATABASE_SSL"
          docker run --rm --network host $E shadoucmdb:amd64 migrate
          docker run --rm --network host $E shadoucmdb:amd64 seed --demo
          docker run --rm --network host --platform linux/arm64 $E shadoucmdb:arm64 verify
          # The key as a mounted file owned by the image's nonroot user (65532).
          openssl rand -base64 32 > encryption.key && chmod 600 encryption.key && sudo chown 65532:65532 encryption.key
          K="-v $PWD/encryption.key:/run/secrets/encryption_key:ro -e ENCRYPTION_KEY_FILE=/run/secrets/encryption_key"
          docker run -d --name cmdb --network host $E $K shadoucmdb:amd64
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/readyz | grep -q '"upToDate":true'
          docker exec cmdb /usr/local/bin/shadoucmdb --version || true
          docker stats --no-stream cmdb
          docker stop cmdb
          docker logs cmdb | tail -3
          # Not grep -q: it stops reading at the first match, and under pipefail the writer's SIGPIPE fails the step.
          docker logs cmdb | grep "server stopped" > /dev/null
